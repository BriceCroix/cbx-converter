name: Run pytest
on: [push]
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        # https://github.com/astral-sh/setup-uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: run pytest
        run: uv run pytest
