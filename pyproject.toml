[project]
name = "cbx-converter"
version = "0.1.0"
description = "Module to convert Comic Book Archives to other types"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "acefile>=0.6.14",
    "img2pdf>=0.6.3",
    "natsort>=8.4.0",
    "puremagic>=2.2.0",
    "py7zr>=1.1.3",
    "rarfile>=4.5",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
cbx_converter = "cbx_converter.__main__:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = "src"
addopts = [
    "--import-mode=importlib",
    "--doctest-modules",
    "--verbose",
    "--cov",
]

[tool.coverage.run]
source = ["src/cbx_converter"]
branch = true

[tool.coverage.report]
show_missing = true