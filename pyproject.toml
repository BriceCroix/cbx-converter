[project]
name = "cbz-converter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "acefile>=0.6.14",
    "img2pdf>=0.6.3",
    "natsort>=8.4.0",
    "puremagic>=2.2.0",
    "py7zr>=1.1.3",
    "rarfile>=4.5",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "pytest>=9.1.1",
]

[project.scripts]
cbz_converter = "cbz_converter.__main__:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = "src"
addopts = [
    "--import-mode=importlib",
    "--doctest-modules",
    "--verbose"
]
